upstream legacy_backend {
    server legacy:8000;
}
upstream modern_backend {
    server modern-1:8000 max_fails=1 fail_timeout=5s;
    server modern-2:8000 max_fails=1 fail_timeout=5s;
}
server {
    listen 80;
    server_tokens off;
    # The /legacy/ and /modern/ routes are mapped to the same application contract.
    location /legacy/ {
        proxy_pass http://legacy_backend/;
        proxy_connect_timeout 1s;
        proxy_read_timeout 4s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    location /modern/ {
        proxy_pass http://modern_backend/;
        proxy_connect_timeout 1s;
        proxy_read_timeout 4s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    location = / {
        add_header Content-Type text/plain;
        return 200 'Synthetic Rail Reliability Lab: try /legacy/search or /modern/search\n';
    }
}
